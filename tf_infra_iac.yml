---
infra_enabled: true
infra:
  rg: "eveng-rg"
  azure_location: "eastus"
  networks:
    - name: "eveng-vnet"
      net: "10.0.0.0/16"
      subnets:
        - name: "eveng-snet"
          net: "10.0.0.0/24"
  vms:
    - vm_name: "eveng-vm"
      unique_vm_alias: "pizour-eveng"
      vnet_name: "eveng-vnet"
      subnet_name: "eveng-snet"
      vm_size: "Standard_D8ds_v4"
      ssh_username: eveng
      open_ports:
        - name: "SSH"
          port: "22"
          priority: 1001
        - name: "HTTP"
          port: "80"
          priority: 1005
        - name: "HTTPs"
          port: "443"
          priority: 1010
        - name: "NETCONF"
          port: "830-840"
          priority: 1015
        - name: "node1-ssh"
          port: "2222"
          priority: 1020
      ssh_pubkey: "ssh-rsa "
